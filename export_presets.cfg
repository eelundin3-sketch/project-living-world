[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="content/**/*.json"
exclude_filter="tests/*,docs/*,scripts/*,builds/*,AGENTS.md,README.md"
export_path="builds/windows/LivingWorld.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.godot/export_templates/windows_debug_x86_64.exe"
custom_template/release="res://.godot/export_templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
codesign/enable=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="content/**/*.json"
exclude_filter="tests/*,docs/*,scripts/*,builds/*,AGENTS.md,README.md"
export_path="builds/macos/LivingWorld.app"
script_export_mode=2

[preset.1.options]
custom_template/debug="res://.godot/export_templates/macos.zip"
custom_template/release="res://.godot/export_templates/macos.zip"
application/bundle_identifier="org.livingworld.prototype"
application/short_version="0.1.0"
application/version="0.1.0"
binary_format/architecture="universal"
codesign/codesign=0
notarization/notarization=0

[preset.2]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="content/**/*.json"
exclude_filter="tests/*,docs/*,scripts/*,builds/*,AGENTS.md,README.md"
export_path="builds/linux/LivingWorld.x86_64"
script_export_mode=2

[preset.2.options]
custom_template/debug="res://.godot/export_templates/linux_debug.x86_64"
custom_template/release="res://.godot/export_templates/linux_release.x86_64"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
