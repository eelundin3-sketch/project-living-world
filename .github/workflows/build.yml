name: Build
# Builds the downloadable games:
#   Project-Solo-Windows.zip  (ProjectSolo.exe, Windows 11 64-bit)
#   Project-Solo-macOS.zip    ("Project Solo.app", universal)
#   - every run uploads them as workflow artifacts (Actions tab -> the run -> Artifacts)
#   - pushing a tag like v0.2.0 also publishes them as assets of a GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - source/export_presets.cfg
      - source/scripts/package_windows.sh
      - source/scripts/package_macos.sh
      - source/tools/prepare_exports.sh
      - .github/workflows/build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Godot and its export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL $base/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -fL $base/Godot_v4.6-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          tools/prepare_exports.sh /tmp/templates.tpz
      - name: Package for Windows
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        run: scripts/package_windows.sh
      - name: Package for macOS
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        run: scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Solo-Windows
          path: source/dist/Project-Solo-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Solo-macOS
          path: source/dist/Project-Solo-macOS.zip
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Project-Solo-Windows.zip dist/Project-Solo-macOS.zip \
            --title "Project Solo $GITHUB_REF_NAME" \
            --notes "Windows 11: unzip Project-Solo-Windows.zip and run ProjectSolo.exe. macOS: unzip Project-Solo-macOS.zip and open Project Solo.app. Neither is code-signed, so the first launch needs one extra step; see the README."
