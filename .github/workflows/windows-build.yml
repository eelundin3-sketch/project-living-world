name: Windows build
# Builds LivingWorld-Windows.zip (a single LivingWorld.exe for Windows 11, 64-bit).
#   - every run uploads it as a workflow artifact (Actions tab -> the run -> Artifacts)
#   - pushing a tag like v0.2.0 also publishes it as a GitHub Release asset
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - export_presets.cfg
      - scripts/package_windows.sh
      - scripts/prepare_exports.sh
      - .github/workflows/windows-build.yml
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Godot and its export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl -fL $base/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -fL $base/Godot_v4.6-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          scripts/prepare_exports.sh /tmp/templates.tpz
      - name: Package for Windows
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        run: scripts/package_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LivingWorld-Windows
          path: dist/LivingWorld-Windows.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/LivingWorld-Windows.zip --title "Project Living World $GITHUB_REF_NAME" --notes "Windows 11 (64-bit): download LivingWorld-Windows.zip, unzip, run LivingWorld.exe. See the README for the SmartScreen prompt."
